# ─── WEATHER STATIONS ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-station-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-station-1
  template:
    metadata:
      labels:
        app: weather-station-1
    spec:
      containers:
        - name: weather-station
          image: localhost:5000/weather-station:latest
          imagePullPolicy: Always
          env:
            - name: STATION_ID
              value: "1"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: KAFKA_TOPIC
              value: "weather_status"

