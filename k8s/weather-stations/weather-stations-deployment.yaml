---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-trigger-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rain-trigger-processor
  template:
    metadata:
      labels:
        app: rain-trigger-processor
    spec:
      containers:
        - name: rain-trigger-processor
          image: localhost:5000/weather-station:latest
          imagePullPolicy: Always
          command:
            [
              "java",
              "-cp",
              "app.jar",
              "com.weather.station.RainTriggerProcessor",
            ]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: KAFKA_TOPIC
              value: "weather_status"

